services:
  - type: web
    name: ai-pulse-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: AI_MODE
        value: mock
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-pulse-db
          property: connectionString
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"

databases:
  - name: ai-pulse-db
    databaseName: aipulse
    user: aipulse_user
    plan: free
